[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-forecast"
version = "0.1.0"
description = "GB National Demand quantile forecast (P10/P50/P90) with live INDO validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.5",
    "holidays>=0.60",
    "requests>=2.32",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "optuna>=4.0",
    "shap>=0.46",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
energy_forecast = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

